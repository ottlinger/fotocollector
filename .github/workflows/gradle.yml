name: Gradle CI

on:
  push:
  pull_request:

jobs:   
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout project sources
      uses: actions/checkout@v7
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: "temurin"
        java-version: "17"
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.4.0
      with:
        cache-provider: basic # Switches to the MIT-licensed open-source implementation
    - name: Run build with Gradle wrapper
      run: ./gradlew build --scan

    - name: Upload build reports
      id: reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-reports-${{ matrix.os }}
        path: |
          build/reports/
          build/test-results/test/TEST-*.xml

    - name: Link build reports in job summary
      if: always() && steps.reports.outputs.artifact-url != ''
      shell: bash
      env:
        REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        RUNNER_OS_NAME: ${{ matrix.os }}
      run: |
        printf '### Gradle reports (%s)\n\n[Download HTML reports and JUnit results](%s)\n\nExtract the archive and open `reports/tests/test/index.html` for the test report.\n' "$RUNNER_OS_NAME" "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

    - name: Show test Summary
      uses: test-summary/action@v2
      with:
        paths: "./build/test-results/test/TEST-*.xml"
      if: always()

    - name: Upload JaCoCo coverage to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/reports/jacoco/test/jacocoTestReport.xml
        disable_search: true
        fail_ci_if_error: true
        verbose: true
